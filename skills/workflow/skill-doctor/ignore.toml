# Known-noise suppression for skill-doctor: tokens below are never reported as
# broken-ref findings. Each group carries its justification.

[noise]
tokens = [
  # CLI tools and role words referenced in prose, not skills or agents
  "adr-tools", "mermaid-compile", "test-runner",
  # OpenCode custom tool names (registered by plugins/mermaid, not skills/agents)
  "mermaid-doctor",
  # md-link plugin: CLI commands + mirror file vocabulary, not skills
  "md-link", "md-link-dir", "md-link-keep", "md-link-persist",
  # external binaries used by plugin renderers
  "rsvg-convert",
  # MCP tools / server profiles, not user-installable skills
  "discord-notify", "playwright-brave",
  # config keys and HTTP headers quoted in docs
  "min-release-age", "x-opencode-password", "x-request-id",
  # frontend/test attribute and media-query names
  "data-testid", "aria-expanded", "prefers-reduced-motion",
  # ecosystem nouns: framework flags, assets, packages, orgs, example users
  "dioxus-ssr", "twemoji-emojis", "yazi-nightly-bin", "vercel-labs", "admin-ubuntu",
  # placeholders, git plumbing, crates, internal tool families
  "a-b", "symbolic-ref", "tracing-subscriber", "opencode-pty",
  # issue-triage label vocabulary (docs/agents/triage-labels.md)
  "needs-info", "needs-triage", "ready-for-agent", "ready-for-human", "wontfix",
  # generated report artifact name (improve-codebase-architecture HTML report)
  "architecture-review",
  # repo doc-file basenames referenced by setup-matt-pocock-skills (docs/agents/*)
  "issue-tracker-github", "issue-tracker-gitlab", "issue-tracker-local", "triage-labels",
  # bundled template/reference files of the upstream skills repo, not installed skills
  "question-example", "questionnaire-template", "spec-template", "user-story-example",
  "issue-template", "local-ticket-template", "vertical-slice-rules",
  # CI workflow vocabulary: GitHub Actions actions, apt packages, env/changelog-mode names
  "upload-artifact", "libxkbcommon-dev", "binary-name", "manual-changelog", "crates-io-production",
  # opencode-skill-creator internal workspace/subcommand names
  "skill-snapshot", "skill-test",
  # skill-doctor's own check-class vocabulary quoted in its docs
  "broken-ref",
  # scheduled-task/scheduled-agent helper script names (scripts/, not skills)
  "octask-add", "octask-remove", "octask-list", "octask-agent-add",
]
