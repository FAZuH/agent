# targets.conf — named sync targets for ./sync.sh
# Format: name=/path/to/project   (lines starting with # are comments; ~ expands)
# The global config (~/.config/opencode) is an implicit target — you do not
# need to list it here. A project listed here installs into <path>/.opencode
# and is selected by name:  ./sync.sh push notes

# notes=~/Projects/notes
# college=~/Projects/college