[package]
name = "octask"
# Version will be updated by CI in `release` branch.
# Avoid modifying version manually or it will break CI


version = "0.1.0"


edition = "2024"
authors = ["FAZuH <mail@fazuh.com>"]
description = "CLI for managed octask-* systemd user timers (exec + agent runs)"
license = "MIT"
repository = "https://github.com/FAZuH/octask"
keywords = ["systemd", "timers", "cli", "scheduling"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints.clippy]
uninlined_format_args = "warn"
new_without_default = "allow"
