# tags.conf — item tags for ./sync.sh -t/--tags.
# Format: one tag per line:  tag=pattern,pattern,...
# Patterns match repo item paths (skills/<cat>/<name>, agents/<cat>/<name>.md,
# plugins/<name>, commands/<name>.md) and may be shell globs / extglob
# (@(a|b), !(a|b), …). The same tag may be defined on several lines; an item
# matching several tags gets all of them. Reserved: "all" (no filter).
# No -t on the command line deploys every item, tagged or not.

# The learning system (ported from oc-learn): teach/visualize skills, the
# tutor, the visual makers, and the quiz + viz plugins they drive.
learn=skills/workflow/@(teach|visualize),agents/primary/tutor.md,agents/vision/@(mermaid-maker|svg-maker).md,plugins/@(quiz|viz)

# Engineering and agent-ops setup: everything the dev workflow needs.
dev=skills/orchestration/*,skills/referential/*,skills/standalone/!(scheduled-task|scheduled-agent|read-pdf),skills/workflow/!(teach|visualize),agents/build/*.md,agents/review/*.md,agents/research/*.md,agents/document/*.md,agents/primary/!(tutor).md,agents/vision/!(mermaid-maker|svg-maker).md,commands/*.md,plugins/!(quiz|viz)

# Machine-agnostic utility skills — useful in any workspace, not tied to the
# dev workflow: task scheduling, PDF reading.
utils=skills/standalone/@(scheduled-task|scheduled-agent|read-pdf)

# OpenCode v2 skills (opencode2 api, sessions, plugins, …).
ocv2=skills/ocv2/*
