# tags.conf: item tags for ./sync.sh -t/--tags.
# Format: one tag per line:  tag=pattern,pattern,...
# Patterns match repo item paths (skills/<cat>/<name>, agents/<cat>/<name>.md,
# plugins/<name>, commands/<path>.md) and may be shell globs / extglob
# (@(a|b), !(a|b), …). The same tag may be defined on several lines; an item
# matching several tags gets all of them. Reserved: "all" (no filter).
# No -t on the command line deploys every item, tagged or not.

# Engineering and agent-ops setup: everything the development workflow needs.
dev=skills/orchestration/*,skills/shared/*,skills/dev/*,skills/meta/*,skills/workflow/*,agents/build/*.md,agents/review/*.md,agents/research/*.md,agents/document/*.md,agents/primary/*.md,commands/*.md,plugins/*,scripts/skill-graph

# ImageScan commands and wrapper.
imagescan=commands/imagescan/*.md,scripts/imagescan

# General machine and tool helpers. gate is shared by scheduled-agent.
utils=skills/utils/*,skills/shared/gate

# OpenCode v2 skills (opencode2 api, sessions, plugins, …).
ocv2=skills/ocv2/*

# Omarchy/Linux desktop skills. Needs the omarchy CLI, so it stays out of dev.
desktop=skills/utils/omarchy-plugin-install
